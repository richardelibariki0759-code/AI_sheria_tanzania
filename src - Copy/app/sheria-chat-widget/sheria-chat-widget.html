<div class="widget-shell" *ngIf="isOpen">
  <div class="widget-card">

    <!-- Header -->
    <header class="widget-header">
      <div class="header-top">
        <div class="header-identity">
          <span class="avatar">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 3 3 7l9 4 9-4-9-4Z" />
              <path d="M3 7v10l9 4 9-4V7" />
              <path d="M12 11v10" />
            </svg>
          </span>
          <div class="header-text">
            <p class="header-title">Sheria AI,</p>
            <p class="header-subtitle">Your Legal Rights Assistant</p>
          </div>
        </div>
        <div class="header-actions">
          <button type="button" class="icon-btn" aria-label="Chat">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
            </svg>
          </button>
          <button type="button" class="icon-btn" (click)="toggleExpanded()" [attr.aria-label]="isExpanded ? 'Collapse' : 'Expand'">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"
                 [class.flipped]="!isExpanded">
              <path d="M18 15l-6-6-6 6" />
            </svg>
          </button>
        </div>
      </div>

      <div class="header-banner">
        <p class="banner-title">Welcome to Sheria AI!</p>
        <p class="banner-subtitle">Ask about your legal rights</p>
      </div>
    </header>

    <!-- Body -->
    <div class="widget-body" *ngIf="isExpanded">
      <div class="message-scroll" #scrollArea>
        <div *ngFor="let message of messages"
             class="message-row"
             [class.message-row--user]="message.from === 'user'">
          <div class="message-bubble" [class.message-bubble--user]="message.from === 'user'">
            {{ message.text }}
          </div>
        </div>

        <div class="topic-divider" *ngIf="topics.length">
          <span class="divider-line"></span>
          <span class="divider-label">↓ Choose a topic to get started</span>
          <span class="divider-line"></span>
        </div>

        <div class="topic-grid">
          <button type="button" class="topic-chip" *ngFor="let topic of topics" (click)="selectTopic(topic)">
            {{ topic }}
          </button>
        </div>
      </div>

      <!-- Input bar -->
      <form class="input-bar" (ngSubmit)="sendMessage()">
        <button type="button" class="input-icon-btn" aria-label="Add attachment">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12h14" />
          </svg>
        </button>
        <input
          class="input-field"
          type="text"
          placeholder="Ask a legal question..."
          [(ngModel)]="draftMessage"
          name="draftMessage"
          autocomplete="off"
        />
        <button type="button" class="input-icon-btn" aria-label="Voice input">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="2" width="6" height="12" rx="3" />
            <path d="M5 10a7 7 0 0 0 14 0M12 19v3" />
          </svg>
        </button>
        <button type="submit" class="send-btn" aria-label="Send message">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="white" stroke-width="2.5">
            <path d="M5 12h14M13 6l6 6-6 6" />
          </svg>
        </button>
      </form>
    </div>
  </div>
</div>

<!-- Floating toggle button -->
<button type="button" class="fab" (click)="toggleWidget()" aria-label="Toggle chat">
  <svg *ngIf="isOpen" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="white" stroke-width="2.5">
    <path d="M18 6 6 18M6 6l12 12" />
  </svg>
  <svg *ngIf="!isOpen" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="white" stroke-width="2">
    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
  </svg>
</button>
