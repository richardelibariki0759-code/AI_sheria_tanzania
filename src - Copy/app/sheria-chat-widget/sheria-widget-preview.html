<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sheria AI — widget preview</title>
<style>
  :root {
    --sheria-orange: #f4821f;
    --sheria-orange-dark: #e0740f;
    --sheria-ink: #2d2a26;
    --sheria-muted: #8a8a8a;
    --sheria-chip-bg: #f5f5f5;
    --sheria-border: #ececec;
    --sheria-bg: #fafafa;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; width: 100%;
    background:
      radial-gradient(900px 700px at 0% 0%, rgba(244,130,31,0.06), transparent 60%),
      radial-gradient(900px 700px at 100% 100%, rgba(45,42,38,0.05), transparent 60%),
      #f4f4f4;
  }
  button { font-family: inherit; }

  .page-note {
    position: fixed; top: 18px; left: 18px; right: 18px;
    font-size: 13px; color: #8a8a8a; max-width: 420px;
  }

  .widget-shell {
    position: fixed;
    right: 24px;
    bottom: 100px;
    width: 400px;
    max-width: calc(100vw - 32px);
    z-index: 1000;
  }
  .widget-shell.hidden { display: none; }

  .widget-card {
    background: #ffffff;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 45px rgba(0, 0, 0, 0.18), 0 4px 14px rgba(0, 0, 0, 0.06);
    display: flex;
    flex-direction: column;
    animation: cardIn 220ms ease-out;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(10px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .widget-header {
    flex-shrink: 0;
    background: linear-gradient(180deg, var(--sheria-orange) 0%, var(--sheria-orange-dark) 100%);
    color: #fff;
    padding: 18px 20px 20px;
  }
  .header-top { display: flex; align-items: flex-start; justify-content: space-between; }
  .header-identity { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: rgba(255,255,255,0.22);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .header-text { min-width: 0; }
  .header-title { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.2; }
  .header-subtitle { margin: 2px 0 0; font-size: 12.5px; font-weight: 400; opacity: 0.9; }
  .header-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .icon-btn {
    background: transparent; border: none; color: #fff;
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.15); }
  .icon-btn:active { transform: scale(0.92); }
  .icon-btn svg { transition: transform 0.2s ease; }
  .icon-btn svg.flipped { transform: rotate(180deg); }

  .header-banner { margin-top: 14px; }
  .banner-title { margin: 0; font-size: 16px; font-weight: 700; }
  .banner-subtitle { margin: 3px 0 0; font-size: 13.5px; font-weight: 400; opacity: 0.95; }

  .widget-body {
    display: flex; flex-direction: column;
    height: min(560px, 65vh);
    min-height: 0;
    background: var(--sheria-bg);
  }

  .message-scroll {
    flex: 1; min-height: 0; overflow-y: auto;
    padding: 16px 18px 4px;
    scroll-behavior: smooth;
  }
  .message-scroll::-webkit-scrollbar { width: 6px; }
  .message-scroll::-webkit-scrollbar-thumb { background: var(--sheria-border); border-radius: 999px; }

  .message-row { display: flex; margin-bottom: 10px; animation: msgIn 200ms ease-out; }
  .message-row--user { justify-content: flex-end; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  .message-bubble {
    background: #ffffff; border: 1px solid var(--sheria-border);
    border-radius: 16px; border-bottom-left-radius: 6px;
    padding: 11px 14px; font-size: 14px; line-height: 1.5;
    color: var(--sheria-ink); max-width: 85%;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .message-bubble--user {
    background: var(--sheria-orange); color: #fff; border-color: transparent;
    border-bottom-left-radius: 16px; border-bottom-right-radius: 6px;
  }

  .topic-divider { display: flex; align-items: center; gap: 10px; margin: 16px 0 12px; }
  .divider-line { flex: 1; height: 1px; background: var(--sheria-border); }
  .divider-label { font-size: 12px; font-weight: 600; color: var(--sheria-orange-dark); white-space: nowrap; }

  .topic-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding-bottom: 14px; }
  .topic-chip {
    background: var(--sheria-chip-bg); border: 1px solid transparent; border-radius: 14px;
    padding: 12px 14px; font-size: 13px; font-weight: 500; color: var(--sheria-ink);
    text-align: left; line-height: 1.35; cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }
  .topic-chip:hover { background: #fff2e4; border-color: #fbd9ae; }
  .topic-chip:active { transform: scale(0.97); }

  .typing-bubble { display: inline-flex; gap: 4px; padding: 13px 14px; }
  .typing-bubble .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--sheria-muted); animation: typingDot 1.2s infinite ease-in-out; }
  .typing-bubble .dot:nth-child(2) { animation-delay: 0.15s; }
  .typing-bubble .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typingDot { 0%,60%,100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-3px); opacity: 1; } }

  .input-bar {
    flex-shrink: 0; display: flex; align-items: center; gap: 6px;
    background: #fff; border-top: 1px solid var(--sheria-border);
    padding: 10px 10px 10px 14px;
  }
  .input-icon-btn {
    background: transparent; border: none; color: var(--sheria-muted);
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .input-icon-btn:hover { background: var(--sheria-chip-bg); color: var(--sheria-ink); }
  .input-field {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 14px; color: var(--sheria-ink); min-width: 0; padding: 8px 0;
  }
  .input-field::placeholder { color: #b3b3b3; }
  .send-btn {
    background: var(--sheria-orange); border: none; width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .send-btn:hover { background: var(--sheria-orange-dark); }
  .send-btn:active { transform: scale(0.92); }
  .send-btn:disabled { background: var(--sheria-border); cursor: default; pointer-events: none; }

  .fab {
    position: fixed; right: 28px; bottom: 28px; width: 56px; height: 56px; border-radius: 50%;
    background: var(--sheria-orange); border: none;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: 0 8px 20px rgba(244,130,31,0.4); z-index: 1001;
    transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.2s ease;
  }
  .fab:hover { transform: scale(1.06); background: var(--sheria-orange-dark); box-shadow: 0 10px 26px rgba(244,130,31,0.5); }
  .fab:active { transform: scale(0.94); }

  @media (max-width: 420px) {
    .widget-shell { right: 12px; left: 12px; bottom: 88px; width: auto; }
    .widget-body { height: min(560px, calc(100vh - 220px)); }
    .fab { right: 20px; bottom: 20px; }
  }
</style>
</head>
<body>

<div class="page-note">Live preview of the updated widget — fixed-height card, same size whether it's showing 1 message or 10. Click the orange button to open it.</div>

<div class="widget-shell" id="shell">
  <div class="widget-card">
    <header class="widget-header">
      <div class="header-top">
        <div class="header-identity">
          <span class="avatar">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 3 3 7l9 4 9-4-9-4Z" />
              <path d="M3 7v10l9 4 9-4V7" />
              <path d="M12 11v10" />
            </svg>
          </span>
          <div class="header-text">
            <p class="header-title">Sheria AI,</p>
            <p class="header-subtitle">Your Legal Rights Assistant</p>
          </div>
        </div>
        <div class="header-actions">
          <button type="button" class="icon-btn" aria-label="Chat">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
            </svg>
          </button>
          <button type="button" class="icon-btn" id="expandBtn" aria-label="Collapse">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" id="expandIcon">
              <path d="M18 15l-6-6-6 6" />
            </svg>
          </button>
        </div>
      </div>
      <div class="header-banner">
        <p class="banner-title">Welcome to Sheria AI!</p>
        <p class="banner-subtitle">Ask about your legal rights</p>
      </div>
    </header>

    <div class="widget-body" id="widgetBody">
      <div class="message-scroll" id="scrollArea">
        <div id="messages"></div>
        <div class="topic-divider" id="topicDivider">
          <span class="divider-line"></span>
          <span class="divider-label">↓ Choose a topic to get started</span>
          <span class="divider-line"></span>
        </div>
        <div class="topic-grid" id="topicGrid"></div>
      </div>

      <form class="input-bar" id="inputBar">
        <button type="button" class="input-icon-btn" aria-label="Add attachment">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12h14" />
          </svg>
        </button>
        <input class="input-field" type="text" id="draftInput" placeholder="Ask a legal question..." autocomplete="off" />
        <button type="button" class="input-icon-btn" aria-label="Voice input">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="2" width="6" height="12" rx="3" />
            <path d="M5 10a7 7 0 0 0 14 0M12 19v3" />
          </svg>
        </button>
        <button type="submit" class="send-btn" id="sendBtn" aria-label="Send message">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="white" stroke-width="2.5">
            <path d="M5 12h14M13 6l6 6-6 6" />
          </svg>
        </button>
      </form>
    </div>
  </div>
</div>

<button type="button" class="fab" id="fab" aria-label="Toggle chat">
  <svg id="fabClose" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="white" stroke-width="2.5">
    <path d="M18 6 6 18M6 6l12 12" />
  </svg>
  <svg id="fabOpen" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="white" stroke-width="2" style="display:none">
    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
  </svg>
</button>

<script>
  const TOPICS = ["Tenant Rights", "Employment Law", "Consumer Rights", "Family Law", "Police Encounters", "Small Claims"];
  const REPLIES = [
    "Under most tenancy laws, your landlord must give written notice before entering your unit — usually 24 hours, except in emergencies.",
    "Good question. In general you're entitled to written notice of termination, and any unpaid wages must be settled on your last day.",
    "As a consumer you typically have the right to a refund or repair if a product is faulty — keep your receipt as proof of purchase.",
    "That depends on your jurisdiction, but generally you have the right to remain silent and to request a lawyer before answering questions."
  ];
  let isOpen = true, isExpanded = true, replyIdx = 0;

  const shell = document.getElementById('shell');
  const widgetBody = document.getElementById('widgetBody');
  const messagesEl = document.getElementById('messages');
  const scrollArea = document.getElementById('scrollArea');
  const topicGrid = document.getElementById('topicGrid');
  const topicDivider = document.getElementById('topicDivider');
  const draftInput = document.getElementById('draftInput');
  const inputBar = document.getElementById('inputBar');
  const fab = document.getElementById('fab');
  const fabOpen = document.getElementById('fabOpen');
  const fabClose = document.getElementById('fabClose');
  const expandBtn = document.getElementById('expandBtn');
  const expandIcon = document.getElementById('expandIcon');

  function addMessage(from, text) {
    const row = document.createElement('div');
    row.className = 'message-row' + (from === 'user' ? ' message-row--user' : '');
    const bubble = document.createElement('div');
    bubble.className = 'message-bubble' + (from === 'user' ? ' message-bubble--user' : '');
    bubble.textContent = text;
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'message-row';
    row.id = 'typingRow';
    row.innerHTML = '<div class="message-bubble"><div class="typing-bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>';
    messagesEl.appendChild(row);
    scrollToBottom();
  }
  function hideTyping() {
    const row = document.getElementById('typingRow');
    if (row) row.remove();
  }

  function scrollToBottom() {
    requestAnimationFrame(() => { scrollArea.scrollTop = scrollArea.scrollHeight; });
  }

  function sendToBackend(text) {
    addMessage('user', text);
    showTyping();
    setTimeout(() => {
      hideTyping();
      addMessage('bot', REPLIES[replyIdx % REPLIES.length]);
      replyIdx++;
    }, 700 + Math.random() * 500);
  }

  TOPICS.forEach(t => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'topic-chip';
    btn.textContent = t;
    btn.onclick = () => sendToBackend(t);
    topicGrid.appendChild(btn);
  });

  addMessage('bot', "I'm Sheria AI. I can help explain your legal rights — choose a topic below or type your question.");

  inputBar.addEventListener('submit', e => {
    e.preventDefault();
    const text = draftInput.value.trim();
    if (!text) return;
    sendToBackend(text);
    draftInput.value = '';
  });

  fab.addEventListener('click', () => {
    isOpen = !isOpen;
    shell.classList.toggle('hidden', !isOpen);
    fabOpen.style.display = isOpen ? 'none' : 'block';
    fabClose.style.display = isOpen ? 'block' : 'none';
    if (isOpen && !isExpanded) { isExpanded = true; widgetBody.style.display = 'flex'; expandIcon.classList.remove('flipped'); }
  });

  expandBtn.addEventListener('click', () => {
    isExpanded = !isExpanded;
    widgetBody.style.display = isExpanded ? 'flex' : 'none';
    expandIcon.classList.toggle('flipped', !isExpanded);
    expandBtn.setAttribute('aria-label', isExpanded ? 'Collapse' : 'Expand');
  });
</script>
</body>
</html>
